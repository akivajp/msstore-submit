# The reusable workflow that apps call to work with their Microsoft Store
# submissions. The caller's job needs `permissions: id-token: write`, and
# its repository an environment named `msstore` that a federated
# credential on the Entra ID app trusts
# (repo:<owner>@<owner_id>/<repo>@<repo_id>:environment:msstore).
name: Microsoft Store

on:
  workflow_call:
    inputs:
      app-id:
        description: The app's Store ID (Partner Center > Product identity), such as 9P6KDQX7JZS4
        required: true
        type: string
      command:
        description: "check | show | submit | discard (see msstore.py --help)"
        required: false
        type: string
        default: check
      artifact:
        description: "submit: the artifact (of this workflow run) that holds the package"
        required: false
        type: string
        default: ""
      package:
        description: "submit: the package's file name in the artifact (a shell pattern)"
        required: false
        type: string
        default: "*.msix"
      listings:
        description: "submit: the folder of listing files (*.toml) in the calling repository"
        required: false
        type: string
        default: ""
      images:
        description: "submit: also replace the screenshots with the listing files' ones"
        required: false
        type: boolean
        default: false
      commit:
        description: "submit: commit the submission (false leaves it as a draft in Partner Center)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  store:
    name: Microsoft Store (${{ inputs.command }})
    runs-on: ubuntu-latest
    # In the caller's repository: what the federated credential trusts.
    environment: msstore
    steps:
      # The calling repository (its listing files and screenshots).
      - uses: actions/checkout@v7
        with:
          path: app
      # This repository (the script).
      - uses: actions/checkout@v7
        with:
          repository: akivajp/msstore-submit
          path: msstore-submit
      - if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: artifact
      - name: Run
        env:
          COMMAND: ${{ inputs.command }}
          APP_ID: ${{ inputs.app-id }}
          ARTIFACT: ${{ inputs.artifact }}
          PACKAGE: ${{ inputs.package }}
          LISTINGS: ${{ inputs.listings }}
          IMAGES: ${{ inputs.images }}
          COMMIT: ${{ inputs.commit }}
        run: |
          args=("$COMMAND" --app-id "$APP_ID")
          if [[ "$COMMAND" == submit ]]; then
            if [[ -n "$ARTIFACT" ]]; then
              # The one file in the artifact that matches the pattern.
              mapfile -t found < <(find artifact -type f -name "$PACKAGE")
              if [[ ${#found[@]} -ne 1 ]]; then
                echo "expected one package matching $PACKAGE in $ARTIFACT, found ${#found[@]}: ${found[*]}" >&2
                exit 1
              fi
              args+=(--package "${found[0]}")
            fi
            [[ -n "$LISTINGS" ]] && args+=(--listings "app/$LISTINGS")
            [[ "$IMAGES" == true ]] && args+=(--images)
            [[ "$COMMIT" == true ]] || args+=(--no-commit)
          fi
          python3 msstore-submit/msstore.py "${args[@]}"
